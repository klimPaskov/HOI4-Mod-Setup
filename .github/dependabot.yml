version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - javascript
    groups:
      npm-updates:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - rust
    groups:
      cargo-updates:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
    groups:
      action-updates:
        patterns:
          - "*"
