name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1" "PyYAML==6.0.3"
      - name: Validate planning package and repository templates
        run: python scripts/validate_repository.py
      - name: Test immutable manifest evidence generation
        run: python -m unittest scripts/test_generate_manifest_evidence.py scripts/test_validate_repository.py scripts/test_linux_release_gates.py scripts/test_linux_secret_service.py
      - name: Check release workflow authority boundaries
        run: |
          python scripts/check_workflow_security.py
          python -m unittest scripts/test_linux_release_gates.py scripts/test_released_acceptance_workflow.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect frontend source
        id: detect
        shell: bash
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Enable package manager
        if: steps.detect.outputs.present == 'true'
        run: corepack enable
      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm lint
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck
      - name: Test frontend
        if: steps.detect.outputs.present == 'true'
        run: pnpm test
      - name: Test free assistant relay
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:relay
      - name: Test release updater assets
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:release-assets
      - name: Test remote acceptance harness boundaries
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:released-harness
      - name: Build frontend
        if: steps.detect.outputs.present == 'true'
        run: pnpm build
      - name: Accessibility contract
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:a11y
      - name: Install browser test runtime
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:e2e:install
      - name: Browser wizard tests
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:e2e

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Rust source
        id: detect
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Rust
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add rustfmt clippy --toolchain 1.88.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Install Linux Tauri dependencies
        if: steps.detect.outputs.present == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - name: Format
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --check
      - name: Clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test Rust
        if: steps.detect.outputs.present == 'true'
        run: node scripts/run_rust_tests.mjs

  core-wasm:
    name: Portable core (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add clippy --toolchain 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
      - name: Build the core and web bindings for the browser
        run: cargo build -p hoi4-setup-core -p hoi4-setup-web --target wasm32-unknown-unknown --release
      - name: Lint the core and web bindings for the browser
        run: cargo clippy -p hoi4-setup-core -p hoi4-setup-web --target wasm32-unknown-unknown -- -D warnings

  web:
    name: Web edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Enable package manager
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
      - name: Install the wasm-bindgen CLI that matches Cargo.lock
        shell: bash
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the web edition
        run: pnpm web:build
      - name: Check the built page
        run: node scripts/check_web_build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-edition
          path: dist-web
          retention-days: 7
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test the web edition in Chromium, Firefox, and WebKit
        run: pnpm test:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-edition-test-results
          path: test-results
          retention-days: 7

  fuzz:
    name: Fuzz target compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect fuzz source
        id: detect
        shell: bash
        run: |
          if [ -f fuzz/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Rust
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install Linux fuzz dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libdbus-1-dev
      - name: Compile fuzz targets
        if: steps.detect.outputs.present == 'true'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  desktop-e2e:
    name: Desktop E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            bundle: appimage,deb
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
          - platform: macos-arm64
            os: macos-15
            bundle: dmg
          - platform: macos-x64
            os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect desktop source
        id: detect
        shell: bash
        run: |
          if [ -f package.json ] && [ -f src-tauri/tauri.conf.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Configure Rust
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/install_linux_dependencies.sh
      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run UI and accessibility gates
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          pnpm test:e2e:install
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm test:a11y
          pnpm test:e2e
      - name: Build native package
        if: steps.detect.outputs.present == 'true'
        shell: bash
        env:
          HOI4_MOD_SETUP_TAURI: "1"
          HOI4_MOD_SETUP_BUNDLE: ${{ matrix.bundle }}
        run: pnpm release:build
      - name: Verify native package
        if: steps.detect.outputs.present == 'true'
        shell: bash
        env:
          HOI4_MOD_SETUP_REQUIRE_TAURI: "1"
        run: pnpm release:verify
      - name: Launch native application smoke test
        if: steps.detect.outputs.present == 'true' && runner.os != 'Linux'
        shell: bash
        run: pnpm desktop:e2e
      - name: Verify isolated Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: env -u HOI4_TEST_IMAGE_VAULT_ADAPTER bash scripts/test_linux_credentials.sh
      - name: Launch Linux application and exercise both packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          HOI4_MOD_SETUP_DEDICATED_LINUX: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          xvfb-run -a dbus-run-session -- pnpm desktop:e2e
          xvfb-run -a dbus-run-session -- pnpm installer:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.detect.outputs.present == 'true'
        with:
          name: hoi4-mod-setup-ci-${{ matrix.platform }}
          path: dist/release/**
          if-no-files-found: error

  candidate-acceptance:
    name: Candidate acceptance (${{ matrix.scenario }})
    needs: desktop-e2e
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [new, kaiserreich, recovery, clients]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hoi4-mod-setup-ci-windows-x64
          path: dist/release
      - name: Install test dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Exercise the source-bound native candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_SCENARIO: ${{ matrix.scenario }}
          HOI4_E2E_CANDIDATE_DIR: ${{ github.workspace }}/dist/release
        run: pnpm test:released-e2e $env:E2E_SCENARIO
      - name: Retain only screenshots and sanitized candidate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-acceptance-${{ matrix.scenario }}
          path: |
            test-results/released-${{ matrix.scenario }}/*.png
            test-results/released-${{ matrix.scenario }}/result.json
          if-no-files-found: warn
          retention-days: 14
