name: Publish project page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/schemas/**"
      - "src-tauri/icons/128x128.png"
      - "crates/**"
      - "src/**"
      - "web/**"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.web.config.ts"
      - "scripts/build_web.mjs"
      - "scripts/check_web_build.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enable package manager
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
      - name: Install the wasm-bindgen CLI that matches Cargo.lock
        shell: bash
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the web edition
        run: pnpm web:build
      - name: Check the web edition
        run: node scripts/check_web_build.mjs
      - name: Assemble the page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/screenshots
          cp site/index.html _site/index.html
          cp docs/screenshots/*.png docs/screenshots/*.jpg _site/screenshots/
          cp src-tauri/icons/128x128.png _site/icon.png
          cp -R dist-web _site/app
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
