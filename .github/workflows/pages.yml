name: Publish project page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/schemas/**"
      - "src-tauri/icons/128x128.png"
      - "crates/**"
      - "src/**"
      - "web/**"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.web.config.ts"
      - "scripts/build_web.mjs"
      - "scripts/check_web_build.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Enable package manager
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
      - name: Install the wasm-bindgen CLI that matches Cargo.lock
        shell: bash
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the web edition
        run: pnpm web:build
      - name: Check the web edition
        run: node scripts/check_web_build.mjs
      - name: Assemble the page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/screenshots
          cp site/index.html _site/index.html
          cp docs/screenshots/*.png docs/screenshots/*.jpg _site/screenshots/
          cp src-tauri/icons/128x128.png _site/icon.png
          cp -R dist-web _site/app
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
