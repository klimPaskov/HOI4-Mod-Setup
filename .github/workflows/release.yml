name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Validate release source
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Bind the tag to current main
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error title=Invalid release source::$1"; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$GITHUB_REF_NAME" ]] || fail "Release must run from the pushed tag ref."
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "Tag must use vMAJOR.MINOR.PATCH format."
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" == "tag" ]] || fail "Release tag must be annotated."
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          checkout_commit="$(git rev-parse "HEAD^{commit}")"
          git fetch --no-tags origin main
          main_commit="$(git rev-parse FETCH_HEAD^{commit})"
          [[ "$tag_commit" == "$checkout_commit" ]] || fail "Checked-out source differs from the annotated tag target."
          [[ "$tag_commit" == "$main_commit" ]] || fail "Release tag must target current main."
          [[ "$(node -p "require('./package.json').version")" == "${GITHUB_REF_NAME#v}" ]] || fail "Tag version differs from package.json."
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Configure Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add rustfmt clippy --toolchain 1.88.0
      - name: Install Linux Tauri validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - name: Install validation dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check "jsonschema==4.25.1" "PyYAML==6.0.3"
      - name: Run release gates without signing or publication authority
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm test:a11y
          pnpm test:e2e
          pnpm test:manifest
          python scripts/validate_repository.py
          python scripts/check_committed_secrets.py
          cargo fmt --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-features --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features -- --test-threads=1
          cargo check --manifest-path fuzz/Cargo.toml --bins

  build-unsigned:
    name: Build unsigned ${{ matrix.platform }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
          - platform: macos-arm64
            os: macos-15
            bundle: dmg
          - platform: macos-x64
            os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build unsigned native package
        shell: bash
        env:
          HOI4_MOD_SETUP_BUNDLE: ${{ matrix.bundle }}
          HOI4_MOD_SETUP_RELEASE: "1"
          HOI4_MOD_SETUP_TAURI: "1"
        run: pnpm release:build
      - name: Verify unsigned native package
        shell: bash
        env:
          HOI4_MOD_SETUP_BUNDLE: ${{ matrix.bundle }}
          HOI4_MOD_SETUP_REQUIRE_TAURI: "1"
          HOI4_MOD_SETUP_REQUIRE_RELEASE_IDENTITY: "1"
        run: pnpm release:verify
      - name: Launch native application smoke test
        shell: bash
        run: pnpm desktop:e2e
      - name: Install, launch, and remove native package
        shell: bash
        run: pnpm installer:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-mod-setup-unsigned-${{ matrix.platform }}
          path: dist/release/**
          if-no-files-found: error

  sign-windows:
    name: Sign Windows installer
    needs: build-unsigned
    if: ${{ vars.HOI4_MOD_SETUP_RELEASE_PUBLISH == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hoi4-mod-setup-unsigned-windows-x64
          path: release-artifact
      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          OFFICIAL_SIGNING_CONFIGURED: ${{ vars.HOI4_MOD_SETUP_RELEASE_SIGNING_CONFIGURED }}
          SIGNING_MODE: ${{ vars.HOI4_MOD_SETUP_WINDOWS_SIGNING_MODE }}
          SIGNER: ${{ vars.HOI4_MOD_SETUP_WINDOWS_SIGNER }}
          TIMESTAMP_URL: ${{ vars.HOI4_MOD_SETUP_WINDOWS_TIMESTAMP_URL }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath release-artifact -Recurse -File -Filter *.exe)
          if ($packages.Count -ne 1) { throw "Expected exactly one Windows installer" }
          if ($env:TIMESTAMP_URL -ne "http://timestamp.digicert.com") { throw "Windows timestamp URL must match the reviewed DigiCert RFC 3161 endpoint" }
          if ($env:OFFICIAL_SIGNING_CONFIGURED -eq "true") {
            if ($env:SIGNING_MODE -ne "artifact-signing") { throw "Official Windows signing requires Azure Artifact Signing" }
            if ([string]::IsNullOrWhiteSpace($env:SIGNER)) { throw "The official Windows signer is required" }
            "SIGNING_LEVEL=configured" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "EXPECTED_SIGNER=$env:SIGNER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "SIGNATURE_METHOD=authenticode-artifact-signing" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "SIGNING_LEVEL=community" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "EXPECTED_SIGNER=ChaosX" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "SIGNATURE_METHOD=authenticode-community-untimestamped" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "WINDOWS_PACKAGE=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Azure login
        if: ${{ vars.HOI4_MOD_SETUP_RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Azure Artifact Signing
        if: ${{ vars.HOI4_MOD_SETUP_RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ vars.HOI4_MOD_SETUP_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.HOI4_MOD_SETUP_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.HOI4_MOD_SETUP_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/release-artifact
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: ${{ vars.HOI4_MOD_SETUP_WINDOWS_TIMESTAMP_URL }}
          timestamp-digest: SHA256
          description: HOI4 Mod Setup
          description-url: https://github.com/klimPaskov/HOI4-Mod-Setup
      - name: Sign community build as ChaosX
        if: ${{ vars.HOI4_MOD_SETUP_RELEASE_SIGNING_CONFIGURED != 'true' }}
        shell: pwsh
        env:
          COMMUNITY_PFX_BASE64: ${{ secrets.WINDOWS_COMMUNITY_PFX_BASE64 }}
          COMMUNITY_PFX_PASSWORD_BASE64: ${{ secrets.WINDOWS_COMMUNITY_PFX_PASSWORD_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COMMUNITY_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:COMMUNITY_PFX_PASSWORD_BASE64)) {
            throw "ChaosX community signing secrets are unavailable"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "hoi4-mod-setup-community-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:COMMUNITY_PFX_BASE64))
          $pfxPassword = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:COMMUNITY_PFX_PASSWORD_BASE64))
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $pfxPassword,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          if ($certificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne "ChaosX") {
            throw "Community signing certificate publisher must be ChaosX"
          }
          "COMMUNITY_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMMUNITY_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe is unavailable on the Windows runner" }
          & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $pfxPassword /d "HOI4 Mod Setup" /du "https://github.com/klimPaskov/HOI4-Mod-Setup" $env:WINDOWS_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw "ChaosX Authenticode signing failed" }
          $certificate.Dispose()
          Remove-Variable pfxPassword -ErrorAction SilentlyContinue
      - name: Verify and record Windows signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:WINDOWS_PACKAGE
          if (-not $signature.SignerCertificate) { throw "Authenticode signer certificate is missing" }
          $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          $communityStatus = @("Valid", "NotTrusted", "UnknownError") -contains [string]$signature.Status
          $statusAccepted = if ($env:SIGNING_LEVEL -eq "community") { $communityStatus } else { $signature.Status -eq "Valid" }
          if (-not $statusAccepted -or $publisher -ne $env:EXPECTED_SIGNER) { throw "Authenticode verification failed" }
          if ($env:SIGNING_LEVEL -eq "community" -and $signature.SignerCertificate.Thumbprint -ne $env:COMMUNITY_CERT_THUMBPRINT) {
            throw "Authenticode signer differs from the configured ChaosX certificate"
          }
          $metadataPath = Join-Path $env:GITHUB_WORKSPACE "release-artifact\BUILD_METADATA.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $metadata.signing = $env:SIGNING_LEVEL
          $metadata | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $metadataPath -Encoding utf8NoBOM
          $relativePackage = [IO.Path]::GetRelativePath((Join-Path $env:GITHUB_WORKSPACE "release-artifact\packages"), $env:WINDOWS_PACKAGE).Replace("\", "/")
          $evidence = [ordered]@{
            schema_version = "1.0.0"
            source_revision = $metadata.sourceRevision
            platform = $metadata.platform
            architecture = $metadata.architecture
            package_sha256 = @{ $relativePackage = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:WINDOWS_PACKAGE).Hash.ToLowerInvariant() }
            method = $env:SIGNATURE_METHOD
          }
          $evidence | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath "release-artifact\SIGNING_VERIFICATION.json" -Encoding utf8NoBOM
          $entries = Get-ChildItem -LiteralPath release-artifact -Recurse -File | Where-Object Name -ne "ARTIFACTS.sha256" | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath((Resolve-Path release-artifact), $_.FullName).Replace("\", "/")
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            }
          } | Sort-Object path
          $entries | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "release-artifact\ARTIFACTS.sha256" -Encoding utf8NoBOM
      - name: Remove Windows community signing material
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @($env:COMMUNITY_PFX_PATH)) {
            if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path -LiteralPath $path)) {
              Remove-Item -LiteralPath $path -Force
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-mod-setup-windows-x64
          path: release-artifact/**
          if-no-files-found: error

  sign-macos:
    name: Sign ${{ matrix.platform }}
    needs: build-unsigned
    if: ${{ vars.HOI4_MOD_SETUP_RELEASE_PUBLISH == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hoi4-mod-setup-unsigned-${{ matrix.platform }}
          path: release-artifact
      - name: Extract macOS application
        shell: bash
        run: |
          set -euo pipefail
          signing_root="${RUNNER_TEMP}/hoi4-mod-setup-signing"
          mkdir -p "$signing_root"
          [[ "$(find release-artifact -type f -name '*.dmg' | wc -l | tr -d ' ')" == "1" ]]
          package="$(find release-artifact -type f -name '*.dmg')"
          mount="${signing_root}/mount"
          app_root="${signing_root}/contents"
          mkdir -p "$mount" "$app_root"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$package"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          [[ "$(find "$mount" -maxdepth 2 -type d -name '*.app' | wc -l | tr -d ' ')" == "1" ]]
          app="$(find "$mount" -maxdepth 2 -type d -name '*.app')"
          ditto "$app" "${app_root}/HOI4 Mod Setup.app"
          hdiutil detach "$mount"
          trap - EXIT
          echo "MACOS_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "MACOS_APP=${app_root}/HOI4 Mod Setup.app" >> "$GITHUB_ENV"
      - name: Sign and notarize official macOS build
        if: ${{ vars.HOI4_MOD_SETUP_RELEASE_SIGNING_CONFIGURED == 'true' }}
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.HOI4_MOD_SETUP_APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.HOI4_MOD_SETUP_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.HOI4_MOD_SETUP_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.HOI4_MOD_SETUP_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.HOI4_MOD_SETUP_MACOS_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.HOI4_MOD_SETUP_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Apple certificate is required}"
          : "${CERTIFICATE_PASSWORD:?Apple certificate password is required}"
          : "${APPLE_ID:?Apple ID is required}"
          : "${APPLE_PASSWORD:?Apple app-specific password is required}"
          : "${APPLE_TEAM_ID:?Apple team ID is required}"
          : "${SIGNING_IDENTITY:?Apple signing identity is required}"
          signing_root="${RUNNER_TEMP}/hoi4-mod-setup-signing"
          keychain="${signing_root}/build.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "${signing_root}/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "${signing_root}/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          codesign --force --deep --options runtime --timestamp --keychain "$keychain" --sign "$SIGNING_IDENTITY" "$MACOS_APP"
          signature_details="$(codesign -dv --verbose=4 "$MACOS_APP" 2>&1)"
          grep -Fqx "Authority=${SIGNING_IDENTITY}" <<<"$signature_details"
          codesign --verify --deep --strict --verbose=2 "$MACOS_APP"
          rm -f "$MACOS_PACKAGE"
          hdiutil create -volname "HOI4 Mod Setup" -srcfolder "$(dirname "$MACOS_APP")" -ov -format UDZO "$MACOS_PACKAGE"
          xcrun notarytool submit "$MACOS_PACKAGE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$MACOS_PACKAGE"
          xcrun stapler validate "$MACOS_PACKAGE"
          echo "MACOS_SIGNING_LEVEL=configured" >> "$GITHUB_ENV"
          echo "MACOS_SIGNATURE_METHOD=codesign-and-stapler" >> "$GITHUB_ENV"
      - name: Sign community macOS build
        if: ${{ vars.HOI4_MOD_SETUP_RELEASE_SIGNING_CONFIGURED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "$MACOS_APP"
          codesign --verify --deep --strict --verbose=2 "$MACOS_APP"
          rm -f "$MACOS_PACKAGE"
          hdiutil create -volname "HOI4 Mod Setup" -srcfolder "$(dirname "$MACOS_APP")" -ov -format UDZO "$MACOS_PACKAGE"
          echo "MACOS_SIGNING_LEVEL=community" >> "$GITHUB_ENV"
          echo "MACOS_SIGNATURE_METHOD=codesign-ad-hoc" >> "$GITHUB_ENV"
      - name: Record macOS signing evidence
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_LEVEL="$MACOS_SIGNING_LEVEL" SIGNATURE_METHOD="$MACOS_SIGNATURE_METHOD" PACKAGE_PATH="$MACOS_PACKAGE" /usr/bin/python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("release-artifact").resolve()
          package = Path(os.environ["PACKAGE_PATH"]).resolve()
          metadata_path = root / "BUILD_METADATA.json"
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata["signing"] = os.environ["SIGNING_LEVEL"]
          metadata_path.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          relative = package.relative_to(root / "packages").as_posix()
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          evidence = {
              "schema_version": "1.0.0",
              "source_revision": metadata["sourceRevision"],
              "platform": metadata["platform"],
              "architecture": metadata["architecture"],
              "package_sha256": {relative: digest},
              "method": os.environ["SIGNATURE_METHOD"],
          }
          (root / "SIGNING_VERIFICATION.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          entries = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "ARTIFACTS.sha256":
                  entries.append({"path": path.relative_to(root).as_posix(), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          (root / "ARTIFACTS.sha256").write_text(json.dumps(entries, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "${RUNNER_TEMP}/hoi4-mod-setup-signing/build.keychain-db" ]]; then
            security delete-keychain "${RUNNER_TEMP}/hoi4-mod-setup-signing/build.keychain-db" >/dev/null 2>&1
          fi
          rm -rf "${RUNNER_TEMP}/hoi4-mod-setup-signing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-mod-setup-${{ matrix.platform }}
          path: release-artifact/**
          if-no-files-found: error

  curate:
    name: Verify signed installers
    needs:
      - sign-windows
      - sign-macos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hoi4-mod-setup-windows-x64
          path: release-artifacts/hoi4-mod-setup-windows-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hoi4-mod-setup-macos-arm64
          path: release-artifacts/hoi4-mod-setup-macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hoi4-mod-setup-macos-x64
          path: release-artifacts/hoi4-mod-setup-macos-x64
      - name: Curate signed publication bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/prepare_release_assets.mjs release-artifacts publication-assets
      - name: Require exactly three public installers
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "HOI4-Mod-Setup-macos-arm64.dmg"
            "HOI4-Mod-Setup-macos-x64.dmg"
            "HOI4-Mod-Setup-windows-x64-setup.exe"
            "RELEASE_NOTES.md"
          )
          mapfile -t actual < <(find publication-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${actual[*]}" == "${expected[*]}" ]]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-mod-setup-publication
          path: publication-assets/**
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: curate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hoi4-mod-setup-publication
          path: publication-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            publication-assets/HOI4-Mod-Setup-macos-arm64.dmg
            publication-assets/HOI4-Mod-Setup-macos-x64.dmg
            publication-assets/HOI4-Mod-Setup-windows-x64-setup.exe
          )
          for asset in "${assets[@]}" publication-assets/RELEASE_NOTES.md; do
            [[ -f "$asset" && ! -L "$asset" ]]
          done
          [[ "$(find publication-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" == "4" ]]
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for ${GITHUB_REF_NAME}; published tags are never reused" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "HOI4 Mod Setup ${GITHUB_REF_NAME#v}" \
            --notes-file publication-assets/RELEASE_NOTES.md
          [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft and (.isPrerelease | not))')" == "true" ]]
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)')" == "false" ]]
