name: Development preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: User-facing prerelease version, for example 0.1.1
        required: true
        default: 0.1.1
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate preview request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main and a semantic version
        env:
          PREVIEW_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$PREVIEW_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

  build:
    name: Build preview ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            bundle: appimage,deb
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
          - platform: macos-arm64
            os: macos-15
            bundle: dmg
          - platform: macos-x64
            os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/install_linux_dependencies.sh
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run application gates
        shell: bash
        run: |
          pnpm test:e2e:install
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm test:a11y
          pnpm test:e2e
      - name: Build native preview
        shell: bash
        env:
          HOI4_MOD_SETUP_TAURI: "1"
          HOI4_MOD_SETUP_BUNDLE: ${{ matrix.bundle }}
        run: pnpm release:build
      - name: Verify native preview
        shell: bash
        env:
          HOI4_MOD_SETUP_REQUIRE_TAURI: "1"
        run: pnpm release:verify
      - name: Launch native preview smoke test
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm desktop:e2e
      - name: Verify isolated Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: env -u HOI4_TEST_IMAGE_VAULT_ADAPTER bash scripts/test_linux_credentials.sh
      - name: Launch Linux application and exercise both packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          HOI4_MOD_SETUP_DEDICATED_LINUX: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          xvfb-run -a dbus-run-session -- pnpm desktop:e2e
          xvfb-run -a dbus-run-session -- pnpm installer:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoi4-mod-setup-preview-${{ matrix.platform }}
          path: dist/release/**
          if-no-files-found: error

  curate:
    name: Verify and curate preview installers
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: preview-artifacts
      - name: Curate and reverify preview assets
        env:
          GITHUB_SHA: ${{ github.sha }}
          PREVIEW_TAG: ${{ github.event.inputs.release_tag || '0.1.1' }}
        run: node scripts/prepare_preview_assets.mjs preview-artifacts publication-assets
      - name: Require exactly five public installers
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "HOI4-Mod-Setup-linux-x64.AppImage"
            "HOI4-Mod-Setup-linux-x64.deb"
            "HOI4-Mod-Setup-macos-arm64.dmg"
            "HOI4-Mod-Setup-macos-x64.dmg"
            "HOI4-Mod-Setup-windows-x64-setup.exe"
            "PREVIEW_RELEASE_NOTES.md"
          )
          mapfile -t actual < <(find publication-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${actual[*]}" == "${expected[*]}" ]]
      - name: Retain combined dependency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoi4-mod-setup-preview-dependency-evidence
          path: |
            preview-artifacts/SBOM.cdx.json
            preview-artifacts/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoi4-mod-setup-publication
          path: publication-assets/**
          if-no-files-found: error

  publish:
    name: Publish GitHub development preview
    needs: curate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hoi4-mod-setup-publication
          path: publication-assets
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PREVIEW_TAG: ${{ github.event.inputs.release_tag || '0.1.1' }}
        shell: bash
        run: |
          set -euo pipefail
          preview_tag="${PREVIEW_TAG}"
          if gh release view "$preview_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A preview already exists for ${preview_tag}; refusing to replace it" >&2
            exit 1
          fi
          assets=(
            publication-assets/HOI4-Mod-Setup-linux-x64.AppImage
            publication-assets/HOI4-Mod-Setup-linux-x64.deb
            publication-assets/HOI4-Mod-Setup-macos-arm64.dmg
            publication-assets/HOI4-Mod-Setup-macos-x64.dmg
            publication-assets/HOI4-Mod-Setup-windows-x64-setup.exe
          )
          for asset in "${assets[@]}" publication-assets/PREVIEW_RELEASE_NOTES.md; do
            [[ -f "$asset" && ! -L "$asset" ]]
          done
          [[ "$(find publication-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" == "6" ]]
          gh release create "$preview_tag" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "HOI4 Mod Setup ${preview_tag}" \
            --notes-file publication-assets/PREVIEW_RELEASE_NOTES.md
