name: Development preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: User-facing prerelease version, for example 0.1.0
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build preview ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
          - platform: macos-arm64
            os: macos-15
            bundle: dmg
          - platform: macos-x64
            os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run application gates
        shell: bash
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm test:a11y
          pnpm test:e2e
      - name: Build native preview
        shell: bash
        env:
          HOI4_MOD_SETUP_TAURI: "1"
          HOI4_MOD_SETUP_BUNDLE: ${{ matrix.bundle }}
        run: pnpm release:build
      - name: Verify native preview
        shell: bash
        env:
          HOI4_MOD_SETUP_REQUIRE_TAURI: "1"
        run: pnpm release:verify
      - name: Launch native preview smoke test
        shell: bash
        run: pnpm desktop:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-mod-setup-preview-${{ matrix.platform }}
          path: dist/release/**
          if-no-files-found: error

  publish:
    name: Publish GitHub development preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: preview-artifacts
      - name: Curate and reverify preview assets
        env:
          GITHUB_SHA: ${{ github.sha }}
          PREVIEW_TAG: ${{ github.event.inputs.release_tag || '0.1.0' }}
        run: node scripts/prepare_preview_assets.mjs preview-artifacts publication-assets
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PREVIEW_TAG: ${{ github.event.inputs.release_tag || '0.1.0' }}
        shell: bash
        run: |
          set -euo pipefail
          preview_tag="${PREVIEW_TAG}"
          if gh release view "$preview_tag" >/dev/null 2>&1; then
            echo "A preview already exists for ${preview_tag}; refusing to replace it" >&2
            exit 1
          fi
          mapfile -d '' assets < <(find publication-assets -maxdepth 1 -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "No preview assets were prepared" >&2
            exit 1
          fi
          gh release create "$preview_tag" \
            "${assets[@]}" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "HOI4 Mod Setup ${preview_tag}" \
            --notes-file publication-assets/PREVIEW_RELEASE_NOTES.md
