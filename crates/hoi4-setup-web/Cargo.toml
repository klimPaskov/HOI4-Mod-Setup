[package]
name = "hoi4-setup-web"
version = "0.1.0"
description = "WebAssembly bindings for the HOI4 Mod Setup web edition"
authors = ["HOI4 Mod Setup contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
hoi4-setup-core = { path = "../hoi4-setup-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.17", features = ["serde"] }
wasm-bindgen = "=0.2.126"
