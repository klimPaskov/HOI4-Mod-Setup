[package]
name = "hoi4-setup-core"
version = "0.1.0"
description = "Portable setup core shared by the HOI4 Mod Setup desktop app and its web edition"
authors = ["HOI4 Mod Setup contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Everything here must build for wasm32-unknown-unknown: no filesystem,
# process, network, OS clock, or OS randomness access outside adapter traits.
[dependencies]
hex = "0.4"
png = "0.17"
jsonschema = { version = "0.49.2", default-features = false }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
unicode-normalization = "0.1.24"
uuid = { version = "1.17", features = ["serde"] }

# jsonschema hashes with ahash, which seeds from getrandom; in the browser that
# randomness comes from the Web Crypto API.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
