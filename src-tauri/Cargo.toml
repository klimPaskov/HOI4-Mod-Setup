[package]
name = "hoi4-mod-setup"
version = "0.3.0"
description = "Safe, evidence-backed setup for agentic Hearts of Iron IV mod projects"
authors = ["HOI4 Mod Setup contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[lib]
name = "hoi4_mod_setup"
path = "src/lib.rs"

[[bin]]
name = "hoi4-mod-setup"
path = "src/main.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater"]

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
hex = "0.4"
jsonschema = { version = "0.49.2", default-features = false }
regex = "1.11"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
toml = "0.8"
uuid = { version = "1.17", features = ["serde", "v4"] }
unicode-normalization = "0.1.24"
tauri = { version = "2.5", optional = true , features = [] }
tauri-plugin-dialog = { version = "2.7", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dev-dependencies]
proptest = "1.7"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["alloc", "NSArray", "NSPathUtilities", "NSString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
