<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HOI4 Mod Setup</title>
<style>
:root{
  --bg:#070a10;
  --app:#0c111a;
  --rail:#0a0f17;
  --surface:#111824;
  --surface-2:#151d2a;
  --line:#263142;
  --line-strong:#35445b;
  --text:#f2f5fa;
  --muted:#96a3b5;
  --muted-2:#68778d;
  --blue:#5b8cff;
  --violet:#8b63f5;
  --green:#45c58a;
  --amber:#e7b44d;
  --red:#ef6b78;
  --shadow:0 30px 90px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
body{display:grid;place-items:center;background:radial-gradient(800px 520px at 76% 8%,rgba(91,140,255,.08),transparent 62%),radial-gradient(700px 500px at 18% 90%,rgba(139,99,245,.07),transparent 65%),#070a10}
.app{width:1440px;height:920px;border:1px solid #2f3c50;border-radius:18px;overflow:hidden;background:var(--app);box-shadow:var(--shadow);display:grid;grid-template-rows:50px 1fr}
.titlebar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0b1018}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:0 0 18px rgba(91,140,255,.18)}
.source{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.window-controls{display:flex;gap:8px;margin-left:18px}.window-controls i{width:10px;height:10px;border-radius:50%;background:#526078}.window-controls i:last-child{background:#d46372}
.shell{display:grid;grid-template-columns:192px 1fr;min-height:0}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:22px 15px 18px;display:flex;flex-direction:column}
.rail-label{font-size:10px;text-transform:uppercase;letter-spacing:1.35px;color:var(--muted-2);padding:0 10px;margin-bottom:10px}
.steps{display:grid;gap:4px}.step{height:42px;border-radius:9px;display:flex;align-items:center;gap:11px;padding:0 10px;color:#7f8ca0;font-size:13px}.step .n{width:24px;height:24px;border-radius:7px;border:1px solid #263448;display:grid;place-items:center;font-size:11px;color:#7f8ca0}.step.done{color:#9eabba}.step.done .n{color:var(--green);border-color:rgba(69,197,138,.35)}.step.active{background:linear-gradient(90deg,rgba(91,140,255,.17),rgba(139,99,245,.10));color:#fff;box-shadow:inset 0 0 0 1px rgba(104,137,255,.24)}.step.active .n{border:0;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.rail-spacer{flex:1}
.rail-meta{border-top:1px solid var(--line);padding:15px 10px 0;color:var(--muted-2);font-size:11px;line-height:1.5}.rail-meta b{display:block;color:#aeb9c8;font-size:12px;margin-bottom:2px}
.main{display:grid;grid-template-rows:1fr 68px;min-width:0;min-height:0}.viewport{padding:30px 44px 24px;overflow:hidden}.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:0 34px;background:#0a0f17}.footer-note{font-size:12px;color:var(--muted-2)}.actions{display:flex;gap:10px}
.btn{height:38px;padding:0 17px;border-radius:9px;border:1px solid var(--line-strong);background:#151d29;color:#dbe3ef;font-weight:650;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;box-shadow:0 10px 24px rgba(83,95,233,.20)}.btn.ghost{background:transparent}.btn.danger{color:#ff9ca6;border-color:rgba(239,107,120,.38);background:rgba(239,107,120,.05)}.btn.disabled{opacity:.38}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#7ca2ff;font-weight:800;margin-bottom:8px}.h1{font-size:29px;line-height:1.15;font-weight:750;letter-spacing:-.5px;margin:0}.sub{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45;max-width:690px}.status{font-size:11px;font-weight:700;border-radius:999px;border:1px solid var(--line-strong);padding:6px 10px;color:#b9c5d4;background:#101722;white-space:nowrap}.status.green{color:#7ee3af;border-color:rgba(69,197,138,.35);background:rgba(69,197,138,.07)}.status.amber{color:#f4cf7a;border-color:rgba(231,180,77,.38);background:rgba(231,180,77,.07)}.status.red{color:#ffa1aa;border-color:rgba(239,107,120,.36);background:rgba(239,107,120,.06)}.status.blue{color:#a9c5ff;border-color:rgba(91,140,255,.38);background:rgba(91,140,255,.07)}
.content{max-width:980px}.content.narrow{max-width:820px}.center{margin:0 auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid32{display:grid;grid-template-columns:1.28fr .72fr;gap:18px}.grid23{display:grid;grid-template-columns:.72fr 1.28fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden}.card.pad{padding:18px}.card-title{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}.soft{color:var(--muted);font-size:12px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.choice{min-height:160px;padding:20px;border:1px solid var(--line);border-radius:13px;background:var(--surface);position:relative}.choice.selected{border-color:#6e91ff;box-shadow:0 0 0 2px rgba(91,140,255,.10)}.choice-icon{width:39px;height:39px;border-radius:10px;background:rgba(91,140,255,.10);border:1px solid rgba(91,140,255,.24);display:grid;place-items:center;font-size:20px;margin-bottom:18px}.choice:nth-child(2) .choice-icon{background:rgba(139,99,245,.10);border-color:rgba(139,99,245,.24)}.choice h3{font-size:17px;margin:0 0 6px}.choice p{font-size:13px;line-height:1.45;color:var(--muted);margin:0;max-width:340px}.radio{position:absolute;top:16px;right:16px;width:18px;height:18px;border:1px solid #52637b;border-radius:50%}.selected .radio{border:5px solid var(--blue);background:#fff}
.recent{margin-top:18px}.row{min-height:54px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:10px 15px;border-bottom:1px solid #202a39}.row:last-child{border-bottom:0}.row b{font-size:13px}.row p{margin:3px 0 0;color:var(--muted-2);font-size:11.5px}.row .value{font-size:12px;color:#b4c0d1}.row.selectable{grid-template-columns:22px 1fr auto}.check{width:18px;height:18px;border:1px solid #40516a;border-radius:5px;display:grid;place-items:center;font-size:11px;color:white}.check.on{border:0;background:linear-gradient(135deg,var(--blue),var(--violet))}
.form{display:grid;gap:14px}.form2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:12px;color:#aeb8c7;font-weight:650;margin-bottom:7px}.field{height:41px;border:1px solid #314056;border-radius:9px;background:#0b111a;padding:0 12px;display:flex;align-items:center;justify-content:space-between;color:#edf2f8;font-size:13px}.field.focus{border-color:#6b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.10)}.field .hint{color:var(--muted-2);font-size:11px}.textarea{height:280px;border:1px solid #314056;border-radius:12px;background:#0b111a;padding:17px;color:#e9eef6;font-size:14px;line-height:1.6}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #2e3c51;border-radius:999px;color:#9faec2;padding:6px 10px;font-size:11px;background:#101722}
.segment{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:#0c121b}.seg{padding:7px 10px;border-radius:6px;color:var(--muted);font-size:11px}.seg.active{background:#1b2636;color:#fff}
.progress{height:7px;border-radius:999px;background:#1b2534;overflow:hidden}.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--violet))}.progress.big{height:9px}.scan-stage{display:flex;justify-content:space-between;margin-top:18px}.scan-stage span{width:10px;height:10px;border-radius:50%;background:#283548}.scan-stage span.done{background:var(--green)}.scan-stage span.active{background:var(--blue);box-shadow:0 0 0 5px rgba(91,140,255,.10)}
.summary{display:flex;gap:10px;flex-wrap:wrap}.metric{min-width:126px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:13px 14px}.metric .n{font-size:22px;font-weight:750;margin-top:2px}.metric .t{color:var(--muted);font-size:11px}.metric.green .n{color:#79dfaa}.metric.amber .n{color:#efc96f}.metric.red .n{color:#ff929e}.metric.blue .n{color:#9bb8ff}
.finding{min-height:62px;display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid #202a39}.finding:last-child{border-bottom:0}.finding .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:rgba(69,197,138,.08);color:#76dea7}.finding.warn .ic{background:rgba(231,180,77,.08);color:#efc96f}.finding b{font-size:13px}.finding p{margin:3px 0 0;color:var(--muted-2);font-size:11.5px}.edit{font-size:11px;color:#a9c5ff}
.toggle{width:38px;height:22px;border-radius:999px;background:#2b3647;position:relative}.toggle:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#dbe3ef;top:3px;left:3px}.toggle.on{background:linear-gradient(90deg,var(--blue),var(--violet))}.toggle.on:after{left:19px;background:white}
.workflow{min-height:112px;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:17px;border-bottom:1px solid #202a39}.workflow:last-child{border-bottom:0}.workflow .ic{width:42px;height:42px;border-radius:11px;background:#172236;display:grid;place-items:center;font-size:20px}.workflow b{font-size:14px}.workflow p{margin:4px 0 0;color:var(--muted);font-size:12px}
.callout{border:1px solid rgba(91,140,255,.28);border-radius:10px;background:rgba(91,140,255,.06);padding:12px 14px;color:#b9cdf9;font-size:12px;line-height:1.45}.callout.amber{border-color:rgba(231,180,77,.30);background:rgba(231,180,77,.06);color:#efcf86}.callout.red{border-color:rgba(239,107,120,.30);background:rgba(239,107,120,.05);color:#f6adb5}
.disclosure{height:42px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:0 15px;color:#aab6c5;font-size:12px}.chev{color:var(--muted-2)}
.server{min-height:58px;display:grid;grid-template-columns:26px 1fr auto auto;gap:11px;align-items:center;padding:10px 14px;border-bottom:1px solid #202a39}.server:last-child{border-bottom:0}.server .ic{width:24px;height:24px;border-radius:7px;background:#172236;display:grid;place-items:center;font-size:12px}.server b{font-size:13px}.server p{margin:3px 0 0;color:var(--muted-2);font-size:11px}.health{font-size:11px;color:#78dfa9}.details{font-size:11px;color:#9bb8ff}
.radio-row{min-height:65px;display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #202a39}.radio-row:last-child{border-bottom:0}.radio-small{width:17px;height:17px;border-radius:50%;border:1px solid #52637b}.radio-row.on .radio-small{border:5px solid var(--blue);background:white}.radio-row b{font-size:13px}.radio-row p{margin:3px 0 0;color:var(--muted-2);font-size:11.5px}
.change{min-height:47px;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid #202a39}.change:last-child{border-bottom:0}.change .kind{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:#172236;color:#94b1ff}.change b{font-size:12.5px}.change .path{font-size:11px;color:var(--muted-2)}
.timeline{display:grid;gap:0}.phase{min-height:48px;display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:10px;padding:7px 0}.phase .picon{width:20px;height:20px;border-radius:50%;border:1px solid #3a4a61;display:grid;place-items:center;font-size:10px;color:#718097}.phase.done .picon{border-color:rgba(69,197,138,.35);color:var(--green)}.phase.active .picon{border:0;background:var(--blue);color:#fff}.phase b{font-size:13px}.phase span:last-child{font-size:11px;color:var(--muted-2)}
.ready{display:flex;align-items:center;gap:18px;border:1px solid rgba(69,197,138,.30);border-radius:14px;background:rgba(69,197,138,.055);padding:22px}.ready .circle{width:44px;height:44px;border-radius:50%;background:var(--green);color:#07120c;display:grid;place-items:center;font-size:23px;font-weight:900}.ready h2{margin:0 0 4px;font-size:20px}.ready p{margin:0;color:var(--muted);font-size:12.5px}
.action-tile{min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:15px}.action-tile .ic{width:32px;height:32px;border-radius:9px;background:#172236;display:grid;place-items:center;margin-bottom:12px}.action-tile b{font-size:13px}.action-tile p{margin:4px 0 0;color:var(--muted-2);font-size:11px;line-height:1.4}
.code{border:1px solid #253246;border-radius:10px;background:#090e15;padding:14px;color:#b9c7d9;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diff-pane{border:1px solid var(--line);border-radius:10px;overflow:hidden}.diff-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);font-size:11px;color:#b9c5d4}.diff-code{height:320px;background:#090e15;padding:13px;color:#aab9cb;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.minus{background:rgba(239,107,120,.13);color:#f3a4ad}.plus{background:rgba(69,197,138,.12);color:#8be4b7}
.recovery{min-height:164px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:18px;position:relative}.recovery.selected{border-color:#6e91ff}.recovery .ic{font-size:24px;margin-bottom:18px}.recovery b{font-size:14px}.recovery p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.recovery .radio{top:14px;right:14px}
.space{height:16px}.space2{height:24px}.right{margin-left:auto}.hidden-copy{color:transparent;height:0;overflow:hidden}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="brand"><div class="mark">H</div>HOI4 Mod Setup</div>
    <div style="display:flex;align-items:center"><div class="source"><span class="dot"></span><span id="sourceText">Workflow source ready</span></div><div class="window-controls"><i></i><i></i><i></i></div></div>
  </div>
  <div class="shell">
    <aside class="rail"><div class="rail-label" id="railLabel">Setup</div><div class="steps" id="steps"></div><div class="rail-spacer"></div><div class="rail-meta" id="railMeta"><b>Agentic-HOI4-Modding</b><span>main · 599497e</span></div></aside>
    <main class="main"><section class="viewport"><div id="screen"></div></section><footer class="footer"><div class="footer-note" id="footerNote">Changes are not applied until review.</div><div class="actions"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Next</button></div></footer></main>
  </div>
</div>
<script>
const S = document.getElementById('screen');
const n = Number(new URLSearchParams(location.search).get('screen') || 1);
const setupSteps=['Project','Review','Components','Integrations','Git','Install','Ready'];
const manageSteps=['Overview','Update','Conflicts','Recovery'];
const activeByScreen={1:1,2:1,3:1,4:2,5:2,6:3,7:4,8:4,9:4,10:4,11:5,12:6,13:6,14:7};
const manageActive={15:2,16:3,17:4};
function renderSteps(){
  const manage=n>=15; const steps=manage?manageSteps:setupSteps; const active=manage?manageActive[n]:activeByScreen[n];
  document.getElementById('railLabel').textContent=manage?'Manage':'Setup';
  document.getElementById('railMeta').innerHTML=manage?'<b>Installed project</b><span>Cold War Curtain</span>':'<b>Agentic-HOI4-Modding</b><span>main · 599497e</span>';
  document.getElementById('steps').innerHTML=steps.map((x,i)=>`<div class="step ${i+1<active?'done':''} ${i+1===active?'active':''}"><span class="n">${i+1<active?'✓':i+1}</span><span>${x}</span></div>`).join('');
}
function headerTop(k,t,s='',badge=''){return `<div class="top"><div><div class="kicker">${k}</div><h1 class="h1">${t}</h1>${s?`<p class="sub">${s}</p>`:''}</div>${badge}</div>`}
function status(text,kind=''){return `<span class="status ${kind}">${text}</span>`}
function check(on=true){return `<span class="check ${on?'on':''}">${on?'✓':''}</span>`}
function field(label,value,hint=''){return `<div><div class="label">${label}</div><div class="field"><span>${value}</span>${hint?`<span class="hint">${hint}</span>`:''}</div></div>`}
function card(title,body,action=''){return `<div class="card">${title?`<div class="card-title"><span>${title}</span>${action}</div>`:''}${body}</div>`}
function setFooter(note,back='Back',next='Next'){document.getElementById('footerNote').textContent=note;document.getElementById('back').textContent=back;document.getElementById('next').textContent=next}
renderSteps();
let html='';
if(n===1){
  html=headerTop('Project','Start a mod project','Choose a starting point.')+`<div class="content narrow"><div class="grid2"><div class="choice selected"><span class="radio"></span><div class="choice-icon">＋</div><h3>Create new mod</h3><p>Start from a short description.</p></div><div class="choice"><span class="radio"></span><div class="choice-icon">⌕</div><h3>Import existing mod</h3><p>Scan the project without changing it.</p></div></div><div class="recent"><div class="label">Recent</div>${card('',`<div class="row"><div><b>Chaos Redux</b><p class="mono">D:\\HOI4 Mods\\chaos_redux</p></div>${status('Ready','green')}</div><div class="row"><div><b>Cold War Curtain</b><p class="mono">D:\\HOI4 Mods\\cold_war_curtain</p></div><span class="value">18 Jul</span></div>`)}</div></div>`;
  setFooter('Nothing is changed until the dry run.','', 'Continue'); document.getElementById('back').style.visibility='hidden';
}
if(n===2){
  html=headerTop('Project','Describe the mod','A few sentences are enough.')+`<div class="content narrow center"><div class="textarea">A Cold War total conversion focused on Southeast Asia, with new countries, political routes, decisions, events, custom doctrines, and long campaigns that can diverge from history.</div><div class="chips"><span class="chip">Total conversion</span><span class="chip">Cold War</span><span class="chip">New countries</span><span class="chip">Custom focus trees</span></div></div>`;
  setFooter('Draft saved locally.');
}
if(n===3){
  html=headerTop('Project','Project identity','Confirm the names and paths used by HOI4 and Codex.',status('Descriptors valid','green'))+`<div class="content"><div class="grid32"><div class="card pad"><div class="form2">${field('Mod name','Cold War Curtain')}${field('Project ID','cold_war_curtain')}${field('Author','Klim Paskov')}${field('Version','0.1.0')}${field('Supported game version','1.17.*')}${field('Default branch','main')}</div><div class="space"></div>${field('Project folder','D:\\HOI4 Mods\\cold_war_curtain','Browse')}</div>${card('Generated files',`<div class="row"><div><b>descriptor.mod</b><p>Inside the project</p></div><span class="details">Preview</span></div><div class="row"><div><b>cold_war_curtain.mod</b><p>HOI4 launcher descriptor</p></div><span class="details">Preview</span></div><div class="disclosure"><span>Advanced fields</span><span class="chev">⌄</span></div>`)}</div></div>`;
  setFooter('Names can be edited later.');
}
if(n===4){
  html=headerTop('Review','Scanning project','Read-only scan in progress.',status('Read only','blue'))+`<div class="content narrow center"><div class="card pad" style="padding:28px"><div style="display:flex;align-items:end;justify-content:space-between"><div><div class="soft">Current check</div><div style="font-size:18px;font-weight:700;margin-top:4px">Localisation conventions</div></div><div style="font-size:24px;font-weight:750">64%</div></div><div class="space2"></div><div class="progress big"><i style="width:64%"></i></div><div class="scan-stage"><span class="done"></span><span class="done"></span><span class="done"></span><span class="active"></span><span></span><span></span></div><div class="space2"></div><div class="row" style="padding:10px 0;border:0"><div><b>Detected so far</b><p>Descriptors, Git, namespaces, skills, Codex configuration</p></div><span class="value">31 findings</span></div></div></div>`;
  setFooter('No project files are being modified.','Cancel','Pause');
