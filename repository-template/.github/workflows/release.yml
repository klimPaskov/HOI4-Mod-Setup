name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bundle: msi
          - platform: macos-arm64
            os: macos-14
            bundle: dmg
          - platform: macos-x64
            os: macos-13
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install dependencies
        shell: bash
        run: |
          test -f package.json
          test -f pnpm-lock.yaml
          test -f Cargo.toml
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check "jsonschema==4.25.1" "PyYAML==6.0.3"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Run release gates
        shell: bash
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm test:a11y
          pnpm test:e2e
          python scripts/validate_repository_templates.py
          python scripts/check_committed_secrets.py
          cargo fmt --all -- --check
      - name: Build Tauri release artifacts
        shell: bash
        env:
          HOI4_MOD_SETUP_BUNDLE: ${{ matrix.bundle }}
          HOI4_MOD_SETUP_RELEASE: "1"
          HOI4_MOD_SETUP_TAURI: "1"
        run: pnpm release:build
      - name: Verify release artifacts
        shell: bash
        run: pnpm release:verify
        env:
          HOI4_MOD_SETUP_REQUIRE_TAURI: "1"
      - name: Launch native application smoke test
        shell: bash
        run: pnpm desktop:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-mod-setup-${{ matrix.platform }}
          path: dist/release/**
          if-no-files-found: error

  draft-release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.HOI4_MOD_SETUP_RELEASE_PUBLISH == 'true' && vars.HOI4_MOD_SETUP_RELEASE_SIGNING_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${assets[@]}" \
            --draft \
            --verify-tag \
            --title "HOI4 Mod Setup ${GITHUB_REF_NAME}" \
            --generate-notes
