name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1" "PyYAML==6.0.3"
      - name: Validate planning package and repository templates
        run: python scripts/validate_repository_templates.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect frontend source
        id: detect
        shell: bash
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - name: Enable package manager
        if: steps.detect.outputs.present == 'true'
        run: corepack enable
      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm lint
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck
      - name: Test frontend
        if: steps.detect.outputs.present == 'true'
        run: pnpm test
      - name: Build frontend
        if: steps.detect.outputs.present == 'true'
        run: pnpm build
      - name: Accessibility contract
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:a11y
      - name: Browser smoke contract
        if: steps.detect.outputs.present == 'true'
        run: pnpm test:e2e

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect Rust source
        id: detect
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Rust
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add rustfmt clippy --toolchain 1.88.0
      - name: Install Linux Tauri dependencies
        if: steps.detect.outputs.present == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - name: Format
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --check
      - name: Clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test Rust
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace

  fuzz:
    name: Fuzz target compilation
    if: ${{ hashFiles('fuzz/Cargo.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  desktop-e2e:
    name: Desktop E2E (${{ matrix.os }})
    if: ${{ hashFiles('package.json', 'src-tauri/tauri.conf.json') != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
          - platform: macos-arm64
            os: macos-14
            bundle: dmg
          - platform: macos-x64
            os: macos-13
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run UI and accessibility gates
        shell: bash
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm test:a11y
          pnpm test:e2e
      - name: Build native package
        shell: bash
        env:
          HOI4_MOD_SETUP_TAURI: "1"
          HOI4_MOD_SETUP_BUNDLE: ${{ matrix.bundle }}
        run: pnpm release:build
      - name: Verify native package
        shell: bash
        env:
          HOI4_MOD_SETUP_REQUIRE_TAURI: "1"
        run: pnpm release:verify
      - name: Launch native application smoke test
        shell: bash
        run: pnpm desktop:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-mod-setup-ci-${{ matrix.platform }}
          path: dist/release/**
          if-no-files-found: error
