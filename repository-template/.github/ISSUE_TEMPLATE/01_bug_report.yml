name: Bug report
description: Report a reproducible HOI4 Mod Setup problem
title: "[Bug] "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, access tokens, private mod files, signing material, or unredacted logs. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v0.1.0-beta.1 or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
        - Other or unsupported
    validations:
      required: true
  - type: dropdown
    id: flow
    attributes:
      label: Flow
      options:
        - Create a new mod
        - Import an existing project
        - Update and Repair
        - Reinstall
        - Rollback
        - Managed removal
        - Application launch or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal test project where possible.
      placeholder: |
        1. Open...
        2. Select...
        3. Review...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add screenshots, readiness IDs, transaction stage, or sanitized log excerpts. Remove usernames and private paths when they are not needed.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private project content, and signing material.
          required: true
        - label: This is not a vulnerability report.
          required: true
